[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpo-project"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn>=1.4", "lightgbm", "optuna", "PyYAML", "scipy", "matplotlib", "seaborn", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

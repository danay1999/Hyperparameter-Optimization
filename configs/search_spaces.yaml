# Initial pilot ranges; review and freeze these before the full study.
elastic_net:
  regression:
    alpha: {low: 0.0001, high: 100.0, scale: log}
    l1_ratio: {low: 0.05, high: 1.0}
  classification:
    C: {low: 0.0001, high: 100.0, scale: log}
    l1_ratio: {low: 0.0, high: 1.0}
    class_weight: {choices: [null, balanced]}
svm:
  common:
    C: {low: 0.001, high: 1000.0, scale: log}
    gamma: {low: 0.00001, high: 1.0, scale: log}
  regression:
    epsilon: {low: 0.001, high: 1.0, scale: log}
  classification:
    class_weight: {choices: [null, balanced]}
lightgbm:
  common:
    learning_rate: {low: 0.01, high: 0.3, scale: log}
    num_leaves: {low: 8, high: 128, type: int}
    max_depth: {choices: [-1, 3, 5, 8, 12]}
    min_child_samples: {low: 5, high: 100, type: int}
    subsample: {low: 0.5, high: 1.0}
    colsample_bytree: {low: 0.5, high: 1.0}
    reg_alpha: {low: 0.000001, high: 10.0, scale: log}
    reg_lambda: {low: 0.000001, high: 10.0, scale: log}
    min_split_gain: {low: 0.0, high: 1.0}
    n_estimators: {low: 50, high: 500, type: int}
